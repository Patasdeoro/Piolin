<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piolin · Mi Xatspace</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #4a2c00, #140900);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .contenedor {
      max-width: 650px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #ffd700;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
    }
    .banner-principal {
      width: 100%;
      max-width: 580px;
      height: auto;
      border-radius: 18px;
      border: 3px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 190, 0, 0.65);
      margin-bottom: 18px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      color: #ffd700;
      text-shadow: 0 0 12px #ff9900;
      margin-top: 5px;
      margin-bottom: 5px;
    }
    .subtitulo {
      color: #ffe680;
      font-style: italic;
      margin-bottom: 20px;
    }
    nav {
      margin: 20px 0;
    }
    nav a {
      color: #ffd700;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
    }
    nav a:hover { 
      color: #ffffff;
      text-shadow: 0 0 8px #ffd700;
    }
    .seccion {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px dashed rgba(255, 215, 0, 0.4);
    }
    h2 { 
      color: #ffcc00; 
    }
    .foto-perfil {
      width: 100%;
      max-width: 340px;
      height: auto;
      border-radius: 15px;
      border: 3px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 180, 0, 0.5);
      margin: 10px 0;
    }
    footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #ffd700;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <!-- IMAGEN PRINCIPAL EN GRANDE AL PRINCIPIO -->
    <img src="https://xatimg.com/image/p6o7oQzRg2R8.png" alt="Piolin Banner" class="banner-principal">

    <h1>✦ PIOLIN ✦</h1>
    <div class="subtitulo">Bienvenidos a mi nido</div>

    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#fotos">Fotos</a>
      <a href="#sobremi">Sobre mí</a>
      <a href="#amigos">Amigos</a>
    </nav>

    <div id="inicio" class="seccion">
      <h2>Bienvenidos a mi nido</h2>
      <p>✦ Me caes mal.✦</p>
    </div>

    <div id="fotos" class="seccion">
      <h2>✦ Mi imagen ✦</h2>
      <img src="https://xatimg.com/image/p6o7oQzRg2R8.png" alt="Piolin" class="foto-perfil">
      <p>Mis fotos.</p>
    </div>

    <div id="sobremi" class="seccion">
      <h2>✦ Sobre mí ✦</h2>
      <p>¡Hola! Soy Piolin. Bienvenidos a mi nido.</p>
    </div>

    <div id="amigos" class="seccion">
      <h2>✦ Amigos ✦</h2>
      <p>Saludos par todos.</p>
    </div>

    <footer>✦ PIOLIN · PATITAS SEXYS ✦</footer>
  </div>

</body>
</html>
